name: Enyaq Scraper
version: "1.2.0"
slug: enyaq_scraper
description: EV market monitor (Škoda Enyaq + Tesla Model Y) with a web dashboard
url: https://github.com/rhopp/enyaqscraper
arch:
  - aarch64
image: ghcr.io/rhopp/enyaq-scraper
ingress: true
ingress_port: 8000
panel_title: Enyaq
panel_icon: mdi:car-electric
startup: services
boot: auto
init: false
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8000]/health
options:
  scrape_time: "04:00"
  report_time: "05:30"
  report_interval_days: 3
  sauto_enabled: true
  notify_ha: true
  enabled_vehicles: "enyaq,tesla_modely"
  openrouter_api_key: ""
schema:
  scrape_time: str
  report_time: str
  report_interval_days: int
  sauto_enabled: bool
  notify_ha: bool
  enabled_vehicles: str
  openrouter_api_key: password
